<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wortwelt">
<title>Wortwelt-Abenteuer</title>
<style>
:root{
  --ink:#2b2350; --paper:#fffdf6; --sky:#bfe8ff; --grass:#8fd46b; --grass2:#6cbf4c;
  --path:#f3d9a4; --accent:#ff7a3d; --accent2:#7a5cff; --good:#2fbf71; --bad:#ff4d5e;
  --gold:#ffc83d; --shadow:0 6px 0 rgba(43,35,80,.25);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;inset:0;background:#bfe8ff;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%;}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.screen.on{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.btn{background:var(--accent);color:#fff;font-weight:800;font-size:clamp(20px,3.2vmin,30px);
  padding:.7em 1.6em;border-radius:999px;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,35,80,.25)}
.btn.purple{background:var(--accent2)}
.btn.green{background:var(--good)}
.btn.small{font-size:clamp(15px,2.2vmin,20px);padding:.5em 1em}

/* ---------- Titel ---------- */
#title{align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 30%,#fff7c9 0,#bfe8ff 55%,#9fd6ff 100%)}
#title h1{font-size:clamp(40px,9vmin,96px);margin:.1em 0;line-height:1;color:var(--accent2);
  text-shadow:0 5px 0 #fff,0 9px 0 rgba(43,35,80,.2);letter-spacing:.02em}
#title p{font-size:clamp(18px,3vmin,28px);margin:.3em 1em 1.2em;font-weight:700}
.titleMons{display:flex;gap:2vmin;justify-content:center;margin:2vmin 0}
.titleMons .m{width:clamp(90px,18vmin,180px);height:clamp(90px,18vmin,180px);animation:bob 2s ease-in-out infinite}
.titleMons .m:nth-child(2){animation-delay:.3s}.titleMons .m:nth-child(3){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cloud{position:absolute;font-size:12vmin;opacity:.9;animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- Name ---------- */
#nameScreen{align-items:center;justify-content:center;background:linear-gradient(#bfe8ff,#e7f7ff)}
.card{background:var(--paper);border-radius:28px;padding:4vmin 5vmin;box-shadow:0 10px 0 rgba(43,35,80,.18);
  text-align:center;max-width:min(92vw,640px)}
.card h2{margin:0 0 .5em;font-size:clamp(24px,4.5vmin,42px)}
#nameInput{font:inherit;font-size:clamp(24px,4.5vmin,40px);text-align:center;width:100%;padding:.4em .6em;
  border-radius:18px;border:4px solid var(--accent2);outline:none;margin-bottom:1em;-webkit-user-select:text;user-select:text}

/* ---------- Partnerwahl ---------- */
#choose{align-items:center;justify-content:center;background:linear-gradient(#fff3d6,#ffe2b8);text-align:center}
#choose h2{font-size:clamp(26px,5vmin,48px);margin:.2em}
#choose p{font-size:clamp(17px,2.8vmin,26px);margin:0 1em 1em;font-weight:700}
.partners{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center;padding:0 2vmin}
.pcard{background:#fff;border-radius:26px;padding:2vmin 2.5vmin 2.5vmin;box-shadow:var(--shadow);width:clamp(170px,27vmin,260px);
  border:5px solid transparent;transition:transform .12s}
.pcard:active{transform:scale(.96)}
.pcard .m{width:100%;aspect-ratio:1}
.pcard b{display:block;font-size:clamp(22px,3.8vmin,34px)}
.pcard span{display:block;font-size:clamp(14px,2.2vmin,19px);font-weight:700;opacity:.75}

/* ---------- Karte ---------- */
#map{background:var(--grass)}
.topbar{display:flex;align-items:center;gap:1.5vmin;padding:1.2vmin 2vmin;background:rgba(255,255,255,.85);
  font-weight:800;font-size:clamp(16px,2.6vmin,24px);z-index:5;flex-wrap:wrap;padding-right:110px}
.topbar .sp{flex:1}
.pill{background:#fff;border-radius:999px;padding:.25em .8em;box-shadow:0 3px 0 rgba(43,35,80,.15);white-space:nowrap}
.mapArea{position:relative;flex:1;overflow:hidden;
  background:
   radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 8%,transparent 9%),
   radial-gradient(circle at 70% 75%,rgba(255,255,255,.15) 0 10%,transparent 11%),
   linear-gradient(160deg,#9ee07a,#76c957)}
.mapArea svg.road{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;font-size:clamp(26px,5vmin,50px);transform:translate(-50%,-50%);pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(74px,12vmin,120px);height:clamp(74px,12vmin,120px);
  border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(43,35,80,.3);display:flex;align-items:center;justify-content:center;
  font-size:clamp(34px,6vmin,58px);border:5px solid #d9d2ff}
.node.done{border-color:var(--gold);background:#fff8dc}
.node.next{border-color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.node.locked{filter:grayscale(1);opacity:.65}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(43,35,80,.3),0 0 0 0 rgba(255,122,61,.7)}50%{box-shadow:0 6px 0 rgba(43,35,80,.3),0 0 0 16px rgba(255,122,61,0)}}
.node .lbl{position:absolute;top:100%;margin-top:8px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.92);
  border-radius:12px;padding:2px 10px;font-size:clamp(13px,2vmin,18px);font-weight:800}
.node .st{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2.2vmin,20px);white-space:nowrap}
.tapme{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:var(--accent);color:#fff;
  font-size:clamp(14px,2.2vmin,20px);font-weight:800;padding:4px 12px;border-radius:12px;white-space:nowrap;animation:bob 1s infinite}
#token{position:absolute;width:clamp(64px,10vmin,100px);height:clamp(64px,10vmin,100px);transform:translate(-50%,-85%);
  transition:left 1.3s ease-in-out,top 1.3s ease-in-out;z-index:4;pointer-events:none}
#token.walk .m{animation:hop .3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.team{display:flex;gap:1vmin;align-items:center;padding:1vmin 2vmin;background:rgba(255,255,255,.85);min-height:9vmin;
  font-weight:800;font-size:clamp(14px,2.2vmin,20px)}
.team .m{width:clamp(44px,7.5vmin,72px);height:clamp(44px,7.5vmin,72px)}

/* ---------- Kampf ---------- */
#battle{background:#fff}
.arena{position:relative;flex:0 0 46%;overflow:hidden;
  background:linear-gradient(#a8dcff 0,#d8f1ff 45%,#9fdc7c 45.2%,#7ccb5c 100%)}
.arena.boss{background:linear-gradient(#5b4aa8 0,#9b86e8 45%,#c9b7ff 45.2%,#a693f0 100%)}
.plat{position:absolute;border-radius:50%;background:rgba(43,35,80,.18)}
.plat.e{right:6%;bottom:0;width:32%;height:12%}
.plat.p{left:6%;bottom:0;width:34%;height:12%}
.mon{position:absolute;transition:transform .2s,opacity .5s}
.mon.enemy{right:10%;bottom:4%;height:64%;aspect-ratio:1}
.mon.partner{left:10%;bottom:4%;height:64%;aspect-ratio:1}
.mon svg{width:100%;height:100%;display:block}
.mon.partner svg{transform:scaleX(-1)}
.hpbox{position:absolute;background:var(--paper);border-radius:16px;padding:1vmin 2vmin;box-shadow:0 4px 0 rgba(43,35,80,.2);
  font-weight:800;font-size:clamp(15px,2.5vmin,24px);min-width:28%}
.hpbox.enemy{right:110px;top:6%}
.hpbox.partner{left:4%;top:6%}
.bar{height:clamp(12px,2vmin,18px);background:#e3defa;border-radius:99px;overflow:hidden;margin-top:.4vmin}
.bar i{display:block;height:100%;width:100%;background:var(--good);border-radius:99px;transition:width .5s}
#hearts{font-size:clamp(18px,3vmin,28px);letter-spacing:.1em}
.qcount{font-size:.75em;opacity:.7;font-weight:700}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.flash{animation:flash .45s}
@keyframes flash{0%,100%{filter:none}30%,70%{filter:brightness(2.2) saturate(.2)}}
.lungeR{animation:lungeR .4s}
@keyframes lungeR{50%{transform:translateX(60%)}}
.lungeL{animation:lungeL .4s}
@keyframes lungeL{50%{transform:translateX(-60%)}}
.faint{opacity:0!important;transform:translateY(40%) scale(.6)!important;transition:all .8s}
.pop{position:absolute;font-size:clamp(34px,7vmin,70px);font-weight:900;pointer-events:none;animation:popUp 1s forwards;z-index:6}
@keyframes popUp{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
#ball{position:absolute;width:clamp(50px,9vmin,80px);height:clamp(50px,9vmin,80px);display:none;z-index:7}
#ball.throw{display:block;animation:throw .9s ease-out forwards}
@keyframes throw{0%{left:15%;top:85%;transform:rotate(0)}60%{top:5%}100%{left:74%;top:55%;transform:rotate(720deg)}}
#ball.wobble{display:block;left:74%;top:55%;animation:wobble .5s ease-in-out 3}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-25deg)}75%{transform:rotate(25deg)}}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vmin;padding:1.5vmin 3vmin 2.5vmin;
  background:linear-gradient(#fffdf6,#fff3dc);border-top:6px solid var(--ink);min-height:0}
.bubble{display:flex;align-items:center;gap:1.5vmin;font-size:clamp(20px,3.6vmin,36px);font-weight:800;text-align:center;justify-content:center}
.speak{background:var(--accent2);color:#fff;border-radius:50%;width:clamp(44px,7vmin,64px);height:clamp(44px,7vmin,64px);
  font-size:clamp(22px,3.6vmin,32px);flex:0 0 auto;box-shadow:0 4px 0 rgba(43,35,80,.25)}
.speak:active{transform:translateY(3px)}
#qPic{font-size:clamp(56px,11vmin,110px);line-height:1;min-height:0;display:flex;align-items:center;gap:2vmin}
#qPic .word{font-size:clamp(34px,7vmin,70px);font-weight:900;color:var(--accent2);background:#fff;padding:.1em .6em;border-radius:20px;box-shadow:0 4px 0 rgba(43,35,80,.15)}
.dot{display:inline-block;width:1em;height:1em;border-radius:50%;border:4px solid rgba(43,35,80,.3);vertical-align:middle}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:1.3em;height:1.3em;padding:0 .15em;border-radius:22%;background:#ffe9a8;
  font-weight:900;font-size:.8em;color:var(--ink);border:4px solid rgba(43,35,80,.2)}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin;width:100%;max-width:900px}
.ans{background:#fff;border:5px solid #d9d2ff;border-radius:22px;font-size:clamp(22px,4vmin,40px);font-weight:900;
  padding:.45em .3em;box-shadow:0 5px 0 rgba(43,35,80,.2);min-height:clamp(64px,10vmin,100px);display:flex;align-items:center;justify-content:center}
.ans.pic{font-size:clamp(40px,7.5vmin,74px);padding:.15em}
.ans:active{transform:translateY(3px)}
.ans.right{background:var(--good);border-color:var(--good);color:#fff;animation:bounce .4s}
.ans.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .4s}
.ans.dim{opacity:.4}
@keyframes bounce{50%{transform:scale(1.08)}}
#msg{font-size:clamp(20px,3.6vmin,34px);font-weight:800;text-align:center;line-height:1.3}
#msg .big{font-size:1.4em}

/* ---------- Dialog ---------- */
#dlg{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:50;background:rgba(43,35,80,.25);
  padding:0 2vmin calc(2vmin + env(safe-area-inset-bottom))}
#dlg.on{display:flex}
.dbox{background:var(--paper);border:6px solid var(--ink);border-radius:26px;width:min(100%,980px);display:flex;gap:2.5vmin;
  padding:2.5vmin 3vmin;align-items:center;box-shadow:0 8px 0 rgba(43,35,80,.3);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#dlgFace{font-size:clamp(56px,11vmin,110px);flex:0 0 auto;width:clamp(70px,13vmin,130px);text-align:center}
#dlgFace .m{width:100%;aspect-ratio:1}
#dlgText{flex:1;font-size:clamp(19px,3.4vmin,32px);font-weight:700;line-height:1.35}
.dbtns{display:flex;flex-direction:column;gap:1.4vmin;align-items:center}

/* ---------- Ende ---------- */
#end{align-items:center;justify-content:center;background:radial-gradient(circle,#fff7c9,#ffd88a);overflow:auto}
.cert{background:#fffdf3;border:10px double var(--gold);border-radius:24px;padding:3vmin 5vmin;text-align:center;
  max-width:min(94vw,820px);box-shadow:0 12px 0 rgba(43,35,80,.2);position:relative;z-index:2}
.cert h1{margin:0;font-size:clamp(34px,7vmin,70px);color:var(--accent)}
.cert .who{font-size:clamp(28px,6vmin,60px);font-weight:900;color:var(--accent2);margin:.1em 0}
.cert p{font-size:clamp(17px,2.9vmin,27px);font-weight:700;margin:.4em 0}
.cert .stars{font-size:clamp(28px,5vmin,48px)}
.cert .row{display:flex;justify-content:center;gap:1vmin;flex-wrap:wrap;margin:1.5vmin 0}
.cert .row .m{width:clamp(54px,9vmin,90px);height:clamp(54px,9vmin,90px)}
.confetti{position:absolute;top:-10vh;font-size:5vmin;animation:fall linear forwards;z-index:1;pointer-events:none}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}

.tbadge{display:inline-block;font-size:.7em;padding:.05em .55em;border-radius:99px;color:#fff;vertical-align:middle;margin-left:.3em}
.dexno{font-size:.7em;opacity:.6;margin-right:.2em}
.enterR{animation:enterR .8s ease-out}
@keyframes enterR{from{transform:translateX(120%)}to{transform:none}}
.enterL{animation:enterL .8s ease-out}
@keyframes enterL{from{transform:translateX(-140%)}to{transform:none}}
.banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;text-align:center;
  font-size:clamp(24px,5vmin,48px);font-weight:900;padding:1.5vmin;z-index:8;animation:bannerIn 1.6s forwards;pointer-events:none}
@keyframes bannerIn{0%{clip-path:inset(0 100% 0 0)}20%,80%{clip-path:inset(0 0 0 0);opacity:1}100%{opacity:0}}
.overlay{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:3vmin calc(3vmin + env(safe-area-inset-right)) calc(3vmin + env(safe-area-inset-bottom)) calc(3vmin + env(safe-area-inset-left))}
.overlay.on{display:flex;animation:fadeIn .3s}
#evo{background:radial-gradient(circle,#4b3d99,#1c1540);color:#fff}
#evoMon{width:min(46vmin,360px);aspect-ratio:1}
#evoMon .m{width:100%;height:100%}
#evoMon.white .m{filter:brightness(0) invert(1) drop-shadow(0 0 20px #fff)}
#evoText{font-size:clamp(22px,4.2vmin,40px);font-weight:800;margin:2vmin 0;min-height:2.6em;max-width:900px}
#lex{background:rgba(43,35,80,.92);color:#fff;justify-content:flex-start;overflow:auto}
#lex h2{font-size:clamp(26px,5vmin,46px);margin:1vmin 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,15vmin,140px),1fr));gap:1.5vmin;width:100%;max-width:1100px;margin:1vmin 0 2vmin}
.dexc{background:#fff;color:var(--ink);border-radius:18px;padding:1vmin;font-weight:800;font-size:clamp(12px,1.9vmin,17px)}
.dexc .m{width:100%;aspect-ratio:1}
.dexc.unk .m{filter:brightness(0);opacity:.25}
.dexc.unk{background:#ddd8f5}
button.pill{font:inherit;font-weight:800;color:var(--ink)}
#resetBtn{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:60;
  background:rgba(255,255,255,.7);border-radius:50%;width:40px;height:40px;font-size:20px;opacity:.6}
#muteBtn{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(56px + env(safe-area-inset-right));z-index:60;
  background:rgba(255,255,255,.7);border-radius:50%;width:40px;height:40px;font-size:20px;opacity:.6}
.flashScreen{position:absolute;inset:0;background:#fff;z-index:40;pointer-events:none;animation:wild 1s forwards}
@keyframes wild{0%,40%,80%{opacity:1}20%,60%,100%{opacity:0}}
</style>
</head>
<body>

<!-- Titel -->
<section id="title" class="screen on">
  <div class="cloud" style="top:6%;animation-duration:38s">☁️</div>
  <div class="cloud" style="top:22%;animation-duration:52s;animation-delay:-20s">☁️</div>
  <h1>Wortwelt-<br>Abenteuer</h1>
  <div class="titleMons" id="titleMons"></div>
  <p>Fange Wortlinge – mit deinen Englisch-Kräften!</p>
  <button class="btn" id="startBtn">▶ Spiel starten</button>
</section>

<!-- Name -->
<section id="nameScreen" class="screen">
  <div class="card">
    <h2>Wie heißt du?</h2>
    <input id="nameInput" maxlength="16" placeholder="Dein Vorname" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn" id="nameBtn">Weiter ▶</button>
  </div>
</section>

<!-- Partnerwahl -->
<section id="choose" class="screen">
  <h2>Wähle deinen Partner!</h2>
  <p>Tippe auf einen Wortling.</p>
  <div class="partners" id="partners"></div>
</section>

<!-- Karte -->
<section id="map" class="screen">
  <div class="topbar">
    <span class="pill" id="mapName">🧒</span>
    <span class="sp"></span>
    <span class="pill" id="mapStars">⭐ 0</span>
    <button class="pill" id="mapCount">📖 Lexikon</button>
  </div>
  <div class="mapArea" id="mapArea"></div>
  <div class="team" id="team"></div>
</section>

<!-- Kampf -->
<section id="battle" class="screen">
  <div class="arena" id="arena">
    <div class="plat e"></div><div class="plat p"></div>
    <div class="hpbox enemy"><span id="eName"></span> <span class="qcount" id="qCount"></span><div class="bar"><i id="eHp"></i></div></div>
    <div class="mon enemy" id="eMon"></div>
    <div class="mon partner" id="pMon"></div>
    <div class="hpbox partner"><span id="pName"></span><div id="hearts"></div></div>
    <div id="ball"></div>
  </div>
  <div class="panel" id="panel">
    <div class="bubble" id="bubble"><span id="qText"></span></div>
    <div id="qPic"></div>
    <div id="answers"></div>
    <div id="msg"></div>
  </div>
</section>

<!-- Ende -->
<section id="end" class="screen">
  <div class="cert" id="cert"></div>
</section>

<!-- Dialog -->
<div id="dlg">
  <div class="dbox">
    <div id="dlgFace">🦉</div>
    <div id="dlgText"></div>
    <div class="dbtns">
      <button class="speak" id="dlgSpeak" aria-label="Vorlesen">🔊</button>
      <button class="btn small" id="dlgNext">Weiter ▶</button>
    </div>
  </div>
</div>

<!-- Entwicklung -->
<div id="evo" class="overlay">
  <div id="evoMon"></div>
  <div id="evoText"></div>
  <button class="btn" id="evoNext" style="visibility:hidden">Weiter ▶</button>
</div>

<!-- Lexikon -->
<div id="lex" class="overlay">
  <h2>📖 Wortling-Lexikon</h2>
  <div id="lexInfo" style="font-weight:700;font-size:clamp(16px,2.6vmin,24px)"></div>
  <div class="dex" id="dex"></div>
  <button class="btn" id="lexClose">Schließen ✕</button>
</div>

<button id="muteBtn"aria-label="Ton an/aus">🔈</button>
<button id="resetBtn" aria-label="Neues Spiel">⟲</button>

<script>
/* ============ EINSTELLUNGEN (hier anpassen) ============ */
const SCHULNAME = "unserer Gesamtschule";   // z. B. "der Gesamtschule Musterstadt"
const FRAGEN_PRO_KAMPF = 4;                // normale Wortlinge
const FRAGEN_BOSS = 6;                     // Endgegner
const HERZEN = 3;

/* ============ VOKABELN ============ */

function shade(hex,amt){
  let n=parseInt(hex.slice(1),16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  const cl=v=>Math.max(0,Math.min(255,v));
  return "#"+((1<<24)|(cl(r)<<16)|(cl(g)<<8)|cl(b)).toString(16).slice(1);
}

/* ============ TON ============ */
let muted=false, actx=null, musicGain=null;
function audio(){
  if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)(); musicGain=actx.createGain(); musicGain.gain.value=1; musicGain.connect(actx.destination);}catch(e){} }
  if(actx&&actx.state==="suspended")actx.resume(); return actx;
}
function tone(freq,dur=.15,type="sine",delay=0,vol=.18,dest,abs){
  if(muted)return; const a=audio(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=abs?delay:a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(dest||a.destination);o.start(t);o.stop(t+dur+.02);
}

};

let musTimer=null, musName=null;
const midi=n=>440*Math.pow(2,(n-69)/12);
function playMusic(name){
  stopMusic(); musName=name; if(muted||!name)return;
  const a=audio(); if(!a)return;
  const m=MUSIC[name], step8=60/m.bpm/2; let next=a.currentTime+.15, i=0;
  musTimer=setInterval(()=>{
    while(next<a.currentTime+.35){
      const n=m.mel[i%m.mel.length]; if(n) tone(midi(n),step8*.9,m.wave,next,m.vol,musicGain,true);
      if(i%2===0){ const bn=m.bass[(i/2)%m.bass.length]; if(bn) tone(midi(bn),step8*1.8,"triangle",next,m.vol*1.6,musicGain,true); }
      next+=step8; i++;
    }
  },100);
}
function stopMusic(){ if(musTimer)clearInterval(musTimer); musTimer=null; }
function duck(){ if(!musicGain||!actx)return; const t=actx.currentTime; musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(.25,t); musicGain.gain.linearRampToValueAtTime(1,t+2.2); }

/* ============ SPRACHE ============ */
let voices=[];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text,lang="en-GB",rate){
  if(muted||!window.speechSynthesis)return;
  duck();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=rate||(lang.startsWith("en")?.8:.95);
  const pref=voices.filter(v=>v.lang&&v.lang.replace("_","-").startsWith(lang.slice(0,2)));
  const v=pref.find(v=>v.lang.replace("_","-")===lang)||pref[0];
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const stripEmoji = t=>t.replace(/<[^>]+>/g,"").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"");
const typeBadge = k=>{ const t=TYPEN[MONS[k].type]; return `<span class="tbadge" style="background:${t.color}">${t.icon} ${MONS[k].type}</span>`; };

/* ============ DIALOG ============ */
function dialog(lines, face="🦉"){
  return new Promise(res=>{
    let i=0; const d=$("#dlg");
    $("#dlgFace").innerHTML = MONS[face] ? monSVG(face) : face;
    const render=()=>{ $("#dlgText").innerHTML=lines[i].replace(/\{name\}/g,S.name).replace(/\{p\}/g,S.partner?MONS[S.partner].name:""); };
    render(); d.classList.add("on");
    $("#dlgSpeak").onclick=()=>speak(stripEmoji($("#dlgText").textContent),"de-DE");
    $("#dlgNext").onclick=()=>{
      SFX.tap(); window.speechSynthesis&&speechSynthesis.cancel(); i++;
      if(i<lines.length) render(); else { d.classList.remove("on"); res(); }
    };
  });
}

/* ============ SPIELSTAND ============ */
let S;
function newGame(){
  S={name:"",partner:null,station:0,stars:[],caught:[],seen:[],owned:[],correct:0,wrong:0};
  $("#nameInput").value="";
  stopMusic(); musName=null;
  ["#dlg","#evo","#lex"].forEach(s=>$(s).classList.remove("on"));
  show("title");
}

/* ============ TITEL / NAME / PARTNER ============ */
$("#titleMons").innerHTML = monSVG("funki")+monSVG("plitsch")+monSVG("knospi");
$("#startBtn").onclick=()=>{ audio(); SFX.tap(); speak(" ","en-GB"); playMusic("map"); show("nameScreen"); };
$("#nameBtn").onclick=async()=>{
  SFX.tap();
  let n=$("#nameInput").value.trim(); n = n ? n.charAt(0).toUpperCase()+n.slice(1) : "Held";
  S.name=n; $("#nameInput").blur();
  show("choose");
  $("#partners").innerHTML="";
  await dialog([
    "Hallo {name}! Ich bin Professorin Eule. Willkommen in der <b>Wortwelt</b>!",
    "Hier leben die <b>Wortlinge</b>. Das sind kleine Monster, die Englisch lieben.",
    "Wenn du einen Wortling triffst, stellt er dir eine <b>Frage</b>. Wählst du die richtige Antwort, greift dein Partner an! 💥",
    "Tippe auf 🔊, dann hörst du, wie man das Wort auf Englisch spricht.",
    "Und wenn dein Partner stark genug ist, <b>entwickelt</b> er sich! ✨",
    "Ganz am Ende wartet der große <b>Lexikus</b> in der Schule. Zuerst brauchst du aber einen Partner. Such dir einen aus!"
  ]);
  renderPartners();
};
$("#nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("#nameBtn").click();});

function renderPartners(){
  const wrap=$("#partners"); wrap.innerHTML="";
  ["funki","plitsch","knospi"].forEach(k=>{
    const b=document.createElement("button"); b.className="pcard";
    b.innerHTML=monSVG(k)+`<b>${MONS[k].name}</b><span>${typeBadge(k)}</span><span>${MONS[k].desc}</span>`;
    b.onclick=async()=>{
      SFX.good(); S.partner=k; S.owned.push(k); b.style.borderColor="var(--accent)";
      await sleep(300);
      await dialog([`Super Wahl! <b>${MONS[k].name}</b> ist ein Wortling vom Typ <b>${MONS[k].type}</b> ${TYPEN[MONS[k].type].icon}.`,
        "Auf der Karte siehst du deinen Weg. Tippe auf den leuchtenden Ort, um loszulaufen. Viel Glück!"], k);
      openMap();
    };
    wrap.appendChild(b);
  });
}

/* ============ KARTE ============ */
const DECOS=[["🌳",30,85],["🌲",4,60],["🌳",62,70],["🌷",48,88],["🌲",92,70],["🌳",70,30],["🪨",30,40],["🌻",95,90],
  ["🌲",40,10],["🌊",6,18],["🌊",28,14],["🌷",66,52],["🍄",88,30],["🌳",58,8],["🦋",24,52]];
function openMap(){
  show("map");
  if(musName!=="map") playMusic("map");
  $("#mapName").textContent="🧒 "+S.name;
  $("#mapStars").textContent="⭐ "+S.stars.reduce((a,b)=>a+b,0);
  $("#mapCount").textContent="📖 Lexikon "+(S.owned.length+S.caught.length)+"/"+DEX.length;
  const area=$("#mapArea");
  const pts=[START,...STATIONS];
  let html=`<svg class="road" viewBox="0 0 100 100" preserveAspectRatio="none">
    <polyline points="${pts.map(p=>p.x+","+p.y).join(" ")}" fill="none" stroke="#f3d9a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width:clamp(26px,5vmin,48px)"/>
    <polyline points="${pts.map(p=>p.x+","+p.y).join(" ")}" fill="none" stroke="#fff" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke-width:4px;stroke-dasharray:10 14" opacity=".8"/>
  </svg>`;
  DECOS.forEach(([e,x,y])=>html+=`<div class="deco" style="left:${x}%;top:${y}%">${e}</div>`);
  html+=`<div class="deco" style="left:${START.x}%;top:${START.y}%">🏡</div>`;
  STATIONS.forEach((st,i)=>{
    const cls = i<S.station?"done":i===S.station?"next":"locked";
    const stars = i<S.station ? `<div class="st">${"⭐".repeat(S.stars[i])}</div>` : (i===S.station?`<div class="tapme">Tippe hier!</div>`:"");
    html+=`<button class="node ${cls}" data-i="${i}" style="left:${st.x}%;top:${st.y}%">${st.icon}${stars}<div class="lbl">${st.name}</div></button>`;
  });
  const cur = S.station===0?START:STATIONS[S.station-1];
  html+=`<div id="token" style="left:${cur.x}%;top:${cur.y}%">${monSVG(S.partner)}</div>`;
  area.innerHTML=html;
  area.querySelectorAll(".node").forEach(n=>n.onclick=()=>{
    const i=+n.dataset.i;
    if(i===S.station) walkTo(i); else { SFX.tap(); n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake"); }
  });
  $("#team").innerHTML="Dein Team: "+monSVG(S.partner)+S.caught.map(monSVG).join("");
}
let busy=false;
async function walkTo(i){
  if(busy)return; busy=true;
  SFX.tap();
  const t=$("#token"), st=STATIONS[i];
  t.classList.add("walk"); t.style.left=st.x+"%"; t.style.top=st.y+"%";
  await sleep(1400); t.classList.remove("walk");
  stopMusic(); SFX.wild();
  const f=document.createElement("div"); f.className="flashScreen"; document.body.appendChild(f);
  await sleep(1000); f.remove(); busy=false;
  startBattle(i);
}

/* ============ LEXIKON ============ */
$("#mapCount").onclick=()=>{
  SFX.tap();
  const have=new Set([...S.owned,...S.caught]), seen=new Set(S.seen);
  $("#lexInfo").textContent=`Du hast ${have.size} von ${DEX.length} Wortlingen. Sammle sie alle!`;
  $("#dex").innerHTML=DEX.map(k=>{
    const known=have.has(k)||seen.has(k);
    return `<div class="dexc ${known?"":"unk"}">${monSVG(k)}<div>${dexNo(k)}</div><div>${known?MONS[k].name:"???"}</div>${known?typeBadge(k):""}${have.has(k)?" ✔️":""}</div>`;
  }).join("");
  $("#lex").classList.add("on");
};
$("#lexClose").onclick=()=>{ SFX.tap(); $("#lex").classList.remove("on"); };

/* ============ KAMPF ============ */
let B=null, lock=false;
const QTYPES=["pic2en","listen","de2en","en2de"];
function buildQueue(st){
  const pool = st.theme==="mix" ? ALL_WORDS : THEMES[st.theme].words;
  let words;
  if(st.theme==="mix"){ // aus jedem Thema mindestens ein Wort
    words = shuffle(Object.keys(THEMES).map(k=>pick(THEMES[k].words)));
    while(words.length<FRAGEN_BOSS){ const w=pick(ALL_WORDS); if(!words.includes(w)) words.push(w); }
  } else words = shuffle(pool).slice(0,FRAGEN_PRO_KAMPF);
  let last=null;
  return words.map(w=>{ let t; do{t=pick(QTYPES);}while(t===last); last=t; return {w,t}; });
}
function makeOptions(w){
  const pool = THEMES[w.theme].words.filter(x=>x!==w);
  return shuffle([w,...shuffle(pool).slice(0,3)]);
}
function banner(html){ const d=document.createElement("div"); d.className="banner"; d.innerHTML=html; $("#arena").appendChild(d); setTimeout(()=>d.remove(),1700); }

async function startBattle(i){
  const st=STATIONS[i], mon=pick(st.mons);
  B={i,st,mon,queue:buildQueue(st),hp:0,max:0,hearts:HERZEN,mistakes:0,asked:0};
  B.max=B.hp=B.queue.length;
  if(!S.seen.includes(mon)) S.seen.push(mon);
  show("battle");
  playMusic(st.boss?"boss":"battle");
  $("#arena").classList.toggle("boss",!!st.boss);
  const e=$("#eMon"), p=$("#pMon");
  e.className="mon enemy enterR"; e.innerHTML=monSVG(mon); e.style.opacity=1; e.style.transform="";
  p.className="mon partner"; p.innerHTML=monSVG(S.partner); p.style.visibility="hidden";
  $("#eName").innerHTML=`<span class="dexno">${dexNo(mon)}</span>${MONS[mon].name}${typeBadge(mon)}`;
  $("#pName").innerHTML=`Du + ${MONS[S.partner].name}${typeBadge(S.partner)}`;
  $("#ball").className=""; $("#ball").innerHTML=ballSVG();
  updateBars();
  clearPanel();
  const intro = st.boss ? `Der Wort-Meister ${MONS[mon].name} erscheint!` : `Ein wildes ${MONS[mon].name} erscheint!`;
  $("#qText").innerHTML = intro;
  setTimeout(()=>banner(intro),500);
  await sleep(2100);
  p.style.visibility="visible"; p.classList.add("enterL");
  $("#qText").innerHTML = `Los, <b>${MONS[S.partner].name}</b>!`;
  SFX.tap();
  await sleep(1000);
  await dialog([`${MONS[mon].cry} ${st.say}`, st.boss?"Lexikus fragt Wörter aus <b>allen</b> Themen. Du schaffst das, {name}!":`Thema: <b>${THEMES[st.theme].label}</b>. Los geht's!`], mon);
  nextQuestion();
}
function updateBars(){
  $("#eHp").style.width=(B.hp/B.max*100)+"%";
  $("#eHp").style.background = B.hp/B.max>.5?"var(--good)":B.hp/B.max>.25?"var(--gold)":"var(--bad)";
  $("#hearts").textContent="❤️".repeat(B.hearts)+"🤍".repeat(HERZEN-B.hearts);
  $("#qCount").textContent = `(${B.max-B.hp}/${B.max})`;
}
function clearPanel(){ $("#qText").innerHTML=""; $("#qPic").innerHTML=""; $("#answers").innerHTML=""; $("#msg").innerHTML="";
  const sb=$("#bubble .speak"); if(sb)sb.remove(); }

function nextQuestion(){
  clearPanel(); lock=false;
  const q=B.queue.shift(); B.cur=q; B.asked++;
  const w=q.w, opts=makeOptions(w);
  const pic=$("#qPic"), ans=$("#answers");
  let label, optHTML, isPic=false;
  if(q.t==="pic2en"){ label="Wie heißt das auf Englisch?"; pic.innerHTML=picHTML(w.pic); optHTML=o=>o.en; }
  if(q.t==="de2en"){ label="Was heißt das auf Englisch?"; pic.innerHTML=`<span class="word">${w.de}</span>`; optHTML=o=>o.en; }
  if(q.t==="en2de"){ label="Was bedeutet das auf Deutsch?"; pic.innerHTML=`<span class="word">${w.en}</span>`; optHTML=o=>o.de; addSpeak(w.en); setTimeout(()=>speak(w.en),300); }
  if(q.t==="listen"){ label="Hör gut zu! Welches Bild passt?"; pic.innerHTML=`<button class="speak" style="width:auto;height:auto;padding:.15em .5em;border-radius:24px;font-size:clamp(34px,6vmin,60px)" id="bigSpeak">🔊 Hören</button>`;
    $("#bigSpeak").onclick=()=>speak(w.en); setTimeout(()=>speak(w.en),300); optHTML=o=>picHTML(o.pic); isPic=true; }
  $("#qText").innerHTML=`<b>${MONS[B.mon].name}:</b> „${label}“`;
  opts.forEach(o=>{
    const b=document.createElement("button"); b.className="ans"+(isPic?" pic":""); b.innerHTML=optHTML(o);
    b.onclick=()=>answer(b,o); ans.appendChild(b);
  });
}
function addSpeak(word){
  const s=document.createElement("button"); s.className="speak"; s.textContent="🔊"; s.onclick=()=>speak(word);
  $("#bubble").appendChild(s);
}
function popText(txt,color,leftPct,topPct){
  const d=document.createElement("div"); d.className="pop"; d.textContent=txt; if(color)d.style.color=color;
  d.style.left=leftPct+"%"; d.style.top=topPct+"%"; $("#arena").appendChild(d); setTimeout(()=>d.remove(),1000);
}
function anim(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),500); }

const LOB=["Super!","Klasse!","Richtig!","Toll gemacht!","Spitze!","Wow!","Genau!","Prima!"];
async function answer(btn,o){
  if(lock)return; lock=true;
  const w=B.cur.w, ok=o===w;
  const btns=[...document.querySelectorAll(".ans")];
  const pair=`${picHTML(w.pic)} <b>${w.en}</b> = ${w.de}`;
  if(ok){
    const pt=TYPEN[MONS[S.partner].type];
    btn.classList.add("right"); btns.forEach(b=>b!==btn&&b.classList.add("dim"));
    SFX.good(); S.correct++;
    speak(w.en);
    await sleep(500);
    $("#qText").innerHTML=`<b>${MONS[S.partner].name}</b> setzt <b style="color:${pt.color}">${pick(pt.atk)}</b> ein! ${pt.icon}`;
    anim($("#pMon"),"lungeR"); await sleep(200);
    SFX.hit(); anim($("#eMon"),"shake"); anim($("#eMon"),"flash");
    popText(pt.icon,null,74,30); setTimeout(()=>popText("💥",null,70,45),150);
    B.hp--; updateBars();
    $("#answers").innerHTML=""; $("#qPic").innerHTML="";
    $("#msg").innerHTML=`<span class="big">${pick(LOB)} 🎉</span><br>${pair}`;
    await sleep(1900);
    if(B.hp<=0) return winBattle();
    nextQuestion();
  } else {
    const et=TYPEN[MONS[B.mon].type];
    btn.classList.add("wrong");
    btns.forEach(b=>{ if(b!==btn) b.classList.add("dim"); });
    SFX.bad(); S.wrong++; B.mistakes++;
    await sleep(450);
    $("#qText").innerHTML=`<b>${MONS[B.mon].name}</b> setzt <b style="color:${et.color}">${pick(et.atk)}</b> ein! ${et.icon}`;
    anim($("#eMon"),"lungeL"); await sleep(200);
    SFX.hit(); anim($("#pMon"),"shake"); popText("💫",null,20,35);
    B.hearts--; updateBars();
    $("#answers").innerHTML=""; $("#qPic").innerHTML="";
    $("#msg").innerHTML=`<span class="big">Fast! 🙂</span><br>Richtig ist: ${pair}<br><small>Das Wort kommt gleich noch einmal.</small>`;
    speak(w.en);
    // Wort später nochmal fragen (anderer Fragetyp)
    const nt = pick(QTYPES.filter(t=>t!==B.cur.t));
    B.queue.splice(Math.min(1,B.queue.length),0,{w,t:nt});
    await sleep(2800);
    if(B.hearts<=0){
      await dialog([`Oh, <b>${MONS[S.partner].name}</b> ist ein bisschen müde.`,"Hier ist ein Heiltrank! 🧪 Jetzt geht es weiter. Du schaffst das!"]);
      B.hearts=HERZEN; updateBars();
    }
    nextQuestion();
  }
}

async function winBattle(){
  clearPanel();
  const st=B.st, m=MONS[B.mon];
  $("#eMon").classList.add("faint");
  stopMusic(); SFX.win();
  const stars = B.mistakes===0?3:B.mistakes<=2?2:1;
  S.stars[B.i]=stars;
  $("#qText").innerHTML=`<b>${m.name}</b> ist besiegt!`;
  await sleep(900);
  const b=document.createElement("button"); b.className="btn purple"; b.innerHTML="⭐ Sternenkugel werfen!";
  $("#answers").style.gridTemplateColumns="1fr"; $("#answers").appendChild(b);
  await new Promise(r=>b.onclick=r);
  SFX.tap(); $("#answers").innerHTML=""; $("#answers").style.gridTemplateColumns="";
  $("#qText").innerHTML="Fang ihn!";
  const ball=$("#ball"); ball.className="throw";
  await sleep(950);
  ball.className="wobble"; SFX.catch();
  await sleep(1600);
  popText("✨",null,74,35);
  S.caught.push(B.mon);
  $("#qText").innerHTML=`Juhu! <b>${m.name}</b> ist jetzt dein Freund! <small>(${dexNo(B.mon)} im Lexikon)</small>`;
  $("#msg").innerHTML=`<span class="big">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</span>`;
  await sleep(1800);
  S.station++;
  if(st.boss){ return finale(); }
  if(EVO_NACH.includes(S.station) && MONS[S.partner].evo) await evolve();
  const tips=[
    "Toll, {name}! Weiter geht's zum Regenbogenwald!",
    "Super! Als Nächstes geht es an den Zahlenstrand.",
    "Prima! Hast du Hunger? Auf zum Picknickplatz!",
    "Klasse! Jetzt geht es in die Spielzeugstadt.",
    "Fantastisch! Nur noch einer: Lexikus wartet in der Schule. Bist du bereit?",
  ];
  await dialog([tips[B.i]]);
  openMap();
}

/* ============ ENTWICKLUNG ============ */
async function evolve(){
  const from=S.partner, to=MONS[from].evo, ov=$("#evo"), mon=$("#evoMon"), txt=$("#evoText"), nx=$("#evoNext");
  nx.style.visibility="hidden";
  mon.className=""; mon.innerHTML=monSVG(from);
  txt.innerHTML=`Nanu? <b>${MONS[from].name}</b> leuchtet ...`;
  ov.classList.add("on");
  await sleep(1600);
  mon.classList.add("white");
  txt.innerHTML=`<b>${MONS[from].name}</b> entwickelt sich!`;
  SFX.evo();
  let d=450;
  for(let k=0;k<9;k++){ mon.innerHTML=monSVG(k%2?from:to); await sleep(d); d=Math.max(110,d*.8); }
  mon.innerHTML=monSVG(to); await sleep(300);
  mon.classList.remove("white"); SFX.win();
  for(let k=0;k<20;k++){ const c=document.createElement("div"); c.className="confetti"; c.textContent=pick(["✨","⭐","🌟"]);
    c.style.left=Math.random()*100+"%"; c.style.animationDuration=(2+Math.random()*3)+"s"; ov.appendChild(c); setTimeout(()=>c.remove(),5000); }
  S.partner=to; S.owned.push(to);
  txt.innerHTML=`Wow! <b>${MONS[from].name}</b> hat sich zu <b>${MONS[to].name}</b> entwickelt! 🎉`;
  speak(`Wow! ${MONS[from].name} hat sich zu ${MONS[to].name} entwickelt!`,"de-DE");
  nx.style.visibility="visible";
  await new Promise(r=>nx.onclick=r);
  SFX.tap(); ov.classList.remove("on");
}

/* ============ ENDE ============ */
async function finale(){
  await dialog(["Unglaublich, {name}! Du hast sogar Lexikus geschafft! 🏆",
    `Du kannst schon richtig viel Englisch. An ${SCHULNAME} lernst du noch viel mehr. Wir freuen uns auf dich!`]);
  const total=S.stars.reduce((a,b)=>a+b,0);
  $("#cert").innerHTML=`
    <h1>🏆 Urkunde 🏆</h1>
    <p>Wortwelt-Meisterin / Wortwelt-Meister</p>
    <div class="who">${S.name}</div>
    <p>hat alle Wortlinge getroffen und<br><b>${S.correct}</b> englische Wörter richtig beantwortet!</p>
    <div class="stars">⭐ ${total} von ${STATIONS.length*3} Sternen</div>
    <div class="row">${monSVG(S.partner)}${S.caught.map(monSVG).join("")}</div>
    <p>Willkommen an ${SCHULNAME}! 🎒</p>
    <button class="btn green" id="againBtn" style="margin-top:1.5vmin">🔄 Neues Spiel</button>`;
  show("end");
  playMusic("map");
  SFX.win();
  speak("Well done, "+S.name+"!","en-GB");
  const end=$("#end");
  for(let k=0;k<40;k++){
    const c=document.createElement("div"); c.className="confetti"; c.textContent=pick(["🎉","⭐","🎊","✨","🌟"]);
    c.style.left=Math.random()*100+"%"; c.style.animationDuration=(3+Math.random()*4)+"s"; c.style.animationDelay=(Math.random()*3)+"s";
    end.appendChild(c); setTimeout(()=>c.remove(),11000);
  }
  $("#againBtn").onclick=()=>{ SFX.tap(); newGame(); };
}

/* ============ KNÖPFE ============ */
$("#muteBtn").onclick=()=>{
  muted=!muted; $("#muteBtn").textContent=muted?"🔇":"🔈";
  if(muted){ if(window.speechSynthesis)speechSynthesis.cancel(); const n=musName; stopMusic(); musName=n; }
  else if(musName) playMusic(musName);
};
$("#resetBtn").onclick=()=>{ if(confirm("Neues Spiel starten? Der aktuelle Spielstand geht verloren.")){ busy=false; lock=false; newGame(); } };
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

newGame();
</script>
